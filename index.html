<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Etiketten‑Restmengen Rechner – Luye Pharma</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1381A6">

<style>
:root {
  --luye-blue: #1381A6;
  --luye-blue-dark: #06419F;
  --luye-orange: #F05F39;
}

/* HEADER */
.app-header {
  position: sticky;
  top: 0;
  background: var(--luye-blue);
  color: white;
  padding: 14px 20px;
  font-size: clamp(20px, 4vw, 28px);
  font-weight: bold;
  text-align: center;
  border-bottom: 4px solid var(--luye-blue-dark);
  z-index: 999;
}

/* BODY */
.app-body {
  padding: 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* INPUTS */
input, select {
  width: 100%;
  padding: clamp(10px, 2vw, 16px);
  font-size: clamp(18px, 3vw, 30px);
  border-radius: 10px;
  border: 2px solid var(--luye-blue);
}

input:focus, select:focus {
  outline: none;
  border-color: var(--luye-blue-dark);
  box-shadow: 0 0 6px var(--luye-blue);
}

/* BUTTONS */
button {
  width: 100%;
  border-radius: 12px;
  padding: clamp(12px, 3vw, 20px);
  font-size: clamp(20px, 3.5vw, 32px);
  margin-top: 10px;
  background: var(--luye-blue);
  color: white;
  border: none;
}

button:hover {
  background: var(--luye-blue-dark);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 25px;
}

.full {
  grid-column: 1 / -1;
}

/* HINT */
.hint {
  background: #e8f6fa;
  border-left: 5px solid var(--luye-blue);
  padding: 14px;
  border-radius: 8px;
  font-size: clamp(14px, 2.5vw, 22px);
}

/* RESULT */
.result {
  margin-top: 30px;
  text-align: center;
  font-size: clamp(36px, 8vw, 64px);
  font-weight: bold;
  color: var(--luye-blue-dark);
}

.unit {
  text-align: center;
  font-size: clamp(14px, 2vw, 24px);
  color: #555;
}

/* ERROR */
.warn {
  border: 3px solid var(--luye-orange) !important;
  background: #ffe6e6 !important;
}

.blink {
  animation: blink 1s infinite;
}

@keyframes blink {
  50% { opacity: .2; }
}

/* PRINT (Desktop only) */
@media print {
  body * {
    visibility: hidden;
  }
}
</style>
</head>

<body>

<div class="app-header">Etiketten‑Restmengen Rechner</div>

<div class="app-body">
  <div class="container">

    <h2>1. Etikettentyp auswählen</h2>
    <select id="typ" onchange="ladePreset()">
      <option value="">– Bitte auswählen –</option>
      <option value="6000">6000 Stück · 69 mm</option>
      <option value="7000">7000 Stück · 58 mm</option>
      <option value="10000">10000 Stück · 40 mm</option>
    </select>

    <h2>2. Messung durchführen</h2>
    <div class="hint">
      Messen Sie den <b>Abstand von der Hülse außen bis zum äußeren Rollenrand</b>.
    </div>

    <div class="grid">
      <div>
        <label>Abstand (mm)</label>
        <input id="abstand" type="number" />
      </div>

      <div>
        <label>Hülse Außendurchmesser (mm)</label>
        <input id="dk" type="number" readonly style="background:#eee;">
      </div>

      <div>
        <label>Etikettenlänge (mm)</label>
        <input id="le" type="number" readonly style="background:#eee;">
      </div>

      <div>
        <label>Abstand zwischen Etiketten (mm)</label>
        <input id="a" type="number" readonly style="background:#eee;">
      </div>

      <div class="full">
        <label>Materialdicke (mm)</label>
        <input id="d" type="number" step="0.0001" readonly style="background:#eee;">
      </div>

      <div class="full">
        <button onclick="berechnen()">Restmenge berechnen</button>
      </div>
    </div>

    <div id="ergebnis" class="result">–</div>
    <div class="unit">verbleibende Etiketten</div>

    <button onclick="druckDialog()">Drucken</button>

  </div>
</div>

<!-- ADMIN BUTTON -->
<button id="adminBtn" onclick="adminLogin()" style="
  background:#ccc;
  color:#444;
  font-size:14px;
  width:auto;
  padding:6px 12px;
  opacity:0.4;
  position:fixed;
  left:10px;
  bottom:10px;
  z-index:1000;
">
  Admin Einstellungen
</button>

<!-- ADMIN POPUP -->
<div id="adminPopup" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  z-index:9999;
">
  <div style="
    background:white;
    width:90%;
    max-width:400px;
    margin:80px auto;
    padding:20px;
    border-radius:12px;
  ">
    <h3>Festwerte bearbeiten</h3>

    <label>Etikettentyp</label>
    <select id="adminTyp" onchange="adminLoadValues()">
      <option value="6000">6000 Stück</option>
      <option value="7000">7000 Stück</option>
      <option value="10000">10000 Stück</option>
    </select>

    <label>Hülse Außendurchmesser (dk)</label>
    <input id="admin_dk" type="number">

    <label>Etikettenlänge (le)</label>
    <input id="admin_le" type="number">

    <label>Abstand (a)</label>
    <input id="admin_a" type="number">

    <label>Materialdicke (d)</label>
    <input id="admin_d" type="number" step="0.0001">

    <button onclick="adminSave()">Speichern</button>
    <button onclick="adminClose()" style="background:#999;">Schließen</button>

    <!-- ⭐ Kontakt im Popup -->
    <div id="kontaktText" style="
      margin-top:15px;
      font-size:13px;
      color:#06419F;
      text-align:center;
    ">
      <a href="mailto:sezginyavuz2017@gmail.com,Sezgin.Yavuz@luyepharma.eu?subject=Rollenrechner%20%3B"
         style="color:#06419F; text-decoration:none;">
         Sezgin Yavuz (E‑Mail)
      </a>
    </div>

  </div>
</div>

<script>
const defaultPresets = {
  "6000": {dk:84, le:69, a:4, d:0.1275},
  "7000": {dk:84, le:58, a:4, d:0.1275},
  "10000": {dk:84, le:40, a:4, d:0.1275}
};

let presets = { ...defaultPresets };

window.addEventListener("load", () => {
  const saved = localStorage.getItem("etiketten_presets");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      for (const key of Object.keys(defaultPresets)) {
        if (parsed[key]) presets[key] = parsed[key];
      }
    } catch {}
  }
});

function ladePreset(){
  const t = typ.value;
  if(!presets[t]) return;
  dk.value = presets[t].dk;
  le.value = presets[t].le;
  a.value  = presets[t].a;
  d.value  = presets[t].d;
}

/* SYSTEMFELDER SPERREN */
["dk", "le", "a", "d"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("keydown", e => e.preventDefault());
  el.addEventListener("wheel", e => e.preventDefault(), { passive: false });
  el.addEventListener("mousedown", e => e.preventDefault());
  el.addEventListener("touchstart", e => e.preventDefault());
});

function berechnen() {
  [abstand, dk, le, a, d].forEach(i => i.classList.remove('warn', 'blink'));
  ergebnis.classList.remove('blink');

  const AB = Number(abstand.value);
  const DK = Number(dk.value);
  const LE = Number(le.value);
  const A  = Number(a.value);
  const D  = Number(d.value);

  if ([AB].some(v => isNaN(v) || v <= 0)) {
    abstand.classList.add('warn','blink');
    ergebnis.innerText = "FEHLER";
    ergebnis.style.color = 'var(--luye-orange)';
    return;
  }

  let fehler = false;

  const maxAbstand = { "6000": 160, "7000": 160, "10000": 160 };
  const maxAB = maxAbstand[typ.value] || 160;

  if (AB < 1 || AB > maxAB) {
    fehler = true;
    abstand.classList.add('warn','blink');
  }

  if (fehler) {
    ergebnis.innerText = "FEHLER";
    ergebnis.style.color = 'var(--luye-orange)';
    return;
  }

  const DA = DK + 2 * AB;

  const anzahl = Math.floor(
    Math.PI * (DA * DA - DK * DK) / (4 * D * (LE + A))
  );

  const typMax = { "6000": 6000, "7000": 7000, "10000": 10000 };
  const max = typMax[typ.value] || 999999;

  if (anzahl > max) {
    ergebnis.classList.add('blink');
    ergebnis.style.color = 'var(--luye-orange)';
  } else {
    ergebnis.classList.remove('blink');
    ergebnis.style.color = 'var(--luye-blue-dark)';
  }

  ergebnis.innerText = anzahl;
}

/* ⭐ NEUE DRUCKMETHODE MIT ZEITSTEMPEL UNTEN LINKS */
function druckDialog() {

  const jetzt = new Date();
  const zeit = 
    jetzt.toLocaleDateString("de-DE") + " – " +
    jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

  const typText = typ.options[typ.selectedIndex]?.text || "-";
  const restText = ergebnis.innerText !== "–" ? ergebnis.innerText + " Stück" : "-";

  const auftrag = document.getElementById("druck_auftrag")?.value || "";
  const material = document.getElementById("druck_material")?.value || "";
  const charge = document.getElementById("druck_charge")?.value || "";

  const w = window.open("", "_blank");

  w.document.write(`
    <html>
    <head>
      <title>Druck</title>
      <style>
        body { font-family: Arial; padding: 20px; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        td { padding: 8px; border-bottom: 1px solid #000; }
        .label { font-weight: bold; width: 150px; }

        /* ⭐ Zeitstempel unten links */
        #timestamp {
          position: fixed;
          bottom: 15mm;
          left: 15mm;
          font-size: 12px;
        }
      </style>
    </head>
    <body>

      <h2>Etiketten‑Restmengen Dokumentation</h2>

      <table>
        <tr><td class="label">Etikettentyp</td><td>${typText}</td></tr>
        <tr><td class="label">Restmenge</td><td>${restText}</td></tr>
        <tr><td class="label">Auftragsnummer</td><td>${auftrag}</td></tr>
        <tr><td class="label">Materialnummer</td><td>${material}</td></tr>
        <tr><td class="label">Chargennummer</td><td>${charge}</td></tr>
      </table>

      <div id="timestamp">
        Datum / Kürzel: ______________________<br><br>
        ${zeit}
      </div>

    </body>
    </html>
  `);

  w.document.close();
  w.print();
  w.close();
}

function adminLogin() {
  const pw = prompt("Passwort eingeben:");
  if (pw === "11111111") {
    adminPopup.style.display = "block";
    adminLoadValues();
  } else if (pw !== null) {
    alert("Falsches Passwort");
  }
}

function adminClose() {
  adminPopup.style.display = "none";
}

function adminLoadValues() {
  const t = adminTyp.value;
  const p = presets[t];
  admin_dk.value = p.dk;
  admin_le.value = p.le;
  admin_a.value  = p.a;
  admin_d.value  = p.d;
}

function adminSave() {
  const t = adminTyp.value;
  presets[t] = {
    dk: Number(admin_dk.value),
    le: Number(admin_le.value),
    a:  Number(admin_a.value),
    d:  Number(admin_d.value)
  };
  localStorage.setItem("etiketten_presets", JSON.stringify(presets));
  alert("Festwerte gespeichert");
  adminClose();
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
