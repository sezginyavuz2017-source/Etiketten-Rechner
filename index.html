<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Luye Pharma Rollenrechner</title>

<style>
:root { --luye: #1381A6; --dark: #06419F; --bg: #f8fafc; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #1e293b; }

.header { background: var(--luye); color: white; padding: 25px; text-align: center; font-weight: bold; font-size: 22px; border-bottom: 5px solid var(--dark); }
.container { max-width: 500px; margin: auto; padding: 15px; padding-bottom: 100px; }

.card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; font-size: 13px; text-transform: uppercase; }

.mess-info { background: #fff9c4; border: 1px solid #fef3c7; color: #92400e; padding: 12px; font-size: 14px; margin-bottom: 15px; border-radius: 8px; text-align: center; font-weight: 500; }

select, input { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
input[readonly] { background: #f1f5f9 !important; color: #64748b; font-weight: bold; border-style: dashed; }

button { width: 100%; padding: 16px; background: var(--luye); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }

.result-box { background: white; border: 3px solid var(--luye); border-radius: 20px; text-align: center; padding: 25px; margin: 20px 0; }
.res-val { font-size: 52px; font-weight: 800; color: var(--dark); display: block; line-height: 1; }

#balkenContainer { width: 100%; background: #e2e8f0; height: 12px; border-radius: 10px; overflow: hidden; margin-top: 15px; display:none; }
#balken { height: 100%; width: 0%; background: var(--luye); transition: width 0.8s ease; }

#adminBtn { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; background: #1e293b; color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; z-index: 9999; opacity: 0.3; }

#adminOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15, 23, 42, 0.95); z-index:10000; padding: 20px; box-sizing: border-box; }
.admin-modal { background: white; color: #1e293b; width: 100%; max-width: 400px; margin: auto; padding: 30px; border-radius: 20px; }

@media print { body * { visibility: hidden; } }
</style>
</head>
<body>

<div class="header">Luye Rollenrechner</div>

<div class="container">
    <div class="card">
        <label>1. Auswahl Etiketten-Typ</label>
        <select id="typ" onchange="ladePreset()">
            <option value="">-- Rolle wählen --</option>
            <option value="6000">6000 Stück (69mm)</option>
            <option value="7000">7000 Stück (58mm)</option>
            <option value="10000">10000 Stück (40mm)</option>
        </select>

        <div class="mess-info">Messung: Hülse bis Außenkante (mm)</div>
        <div class="mess-grafik" style="text-align:center; margin-bottom:15px;">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" stroke="#cbd5e1" stroke-width="1" fill="#f8fafc" />
                <circle cx="50" cy="50" r="20" stroke="#475569" stroke-width="2" fill="#e2e8f0" />
                <line x1="70" y1="50" x2="95" y2="50" stroke="#F05F39" stroke-width="3" />
                <path d="M95 47 L100 50 L95 53 Z" fill="#F05F39" />
                <path d="M70 47 L65 50 L70 53 Z" fill="#F05F39" />
            </svg>
        </div>

        <label>2. Messwert eingeben</label>
        <input id="abstand" type="number" step="0.1" inputmode="decimal" placeholder="Messwert in mm" onkeydown="if(event.key==='Enter')berechnen()">
        
        <button onclick="berechnen()">BERECHNEN</button>
    </div>

    <div class="card" style="background: #f8fafc; border-style: dashed;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div><label style="font-size:10px;">Kern Ø</label><input id="dk" readonly></div>
            <div><label style="font-size:10px;">Länge le</label><input id="le" readonly></div>
            <div><label style="font-size:10px;">Lücke a</label><input id="a" readonly></div>
            <div><label style="font-size:10px;">Dicke d</label><input id="d" readonly></div>
        </div>
    </div>

    <div class="result-box">
        <span id="ergebnis" class="res-val">--</span>
        <div style="font-size: 14px; color: #64748b; font-weight: 600;">Etiketten auf Rolle</div>
        <div id="prozentText" style="font-weight:700; color: var(--luye); margin-top:10px;"></div>
        <div id="balkenContainer"><div id="balken"></div></div>
    </div>

    <div class="card">
        <label>3. Protokoll-Daten</label>
        <input id="auftrag" placeholder="Auftragsnummer">
        <input id="charge" placeholder="Chargennummer / Gebinde">
        <button onclick="drucken()" style="background:#1e293b;">GMP-PROTOKOLL DRUCKEN</button>
    </div>
</div>

<div id="adminBtn" onclick="openAdmin()">ADMIN</div>

<div id="adminOverlay">
    <div class="admin-modal">
        <h3>Admin-Einstellungen</h3>
        <input id="adminPW" type="password" placeholder="Passwort">
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <select id="adTyp" onchange="ladeAdminDaten()">
            <option value="6000">6000er</option>
            <option value="7000">7000er</option>
            <option value="10000">10000er</option>
        </select>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div><label>dk</label><input id="ad_dk" type="number" step="0.1"></div>
          <div><label>le</label><input id="ad_le" type="number" step="0.1"></div>
          <div><label>a</label><input id="ad_a" type="number" step="0.1"></div>
          <div><label>d</label><input id="ad_d" type="number" step="0.0001"></div>
        </div>
        <button onclick="saveAdmin()" style="background:#059669;">SPEICHERN</button>
        <button onclick="closeAdmin()" style="background:#64748b; margin-top:10px;">SCHLIESSEN</button>
    </div>
</div>

<script>
const defaultValues = {
    "6000": {dk:84, le:69, a:4, d:0.1275},
    "7000": {dk:84, le:58, a:4, d:0.1275},
    "10000": {dk:84, le:40, a:4, d:0.1275}
};
let db = JSON.parse(localStorage.getItem("luye_v9")) || defaultValues;

function ladePreset() {
    const w = document.getElementById("typ").value;
    if(w && db[w]) {
        document.getElementById("dk").value = db[w].dk;
        document.getElementById("le").value = db[w].le;
        document.getElementById("a").value = db[w].a;
        document.getElementById("d").value = db[w].d;
    }
}

function berechnen() {
    const t = document.getElementById("typ").value;
    const m = parseFloat(document.getElementById("abstand").value);
    const DK = parseFloat(document.getElementById("dk").value);
    const LE = parseFloat(document.getElementById("le").value);
    const A = parseFloat(document.getElementById("a").value);
    const D = parseFloat(document.getElementById("d").value);
    if(!t || isNaN(m)) return;
    const DA = DK + (2 * m);
    const erg = Math.max(0, Math.floor((Math.PI * (DA*DA - DK*DK)) / (4 * D * (LE + A))));
    document.getElementById("ergebnis").innerText = erg.toLocaleString('de-DE');
    const p = Math.min(100, Math.round((erg / parseInt(t)) * 100));
    document.getElementById("balkenContainer").style.display = "block";
    document.getElementById("balken").style.width = p + "%";
    document.getElementById("prozentText").innerText = p + "% Restmenge";
}

function openAdmin() { document.getElementById("adminOverlay").style.display = "block"; ladeAdminDaten(); }
function closeAdmin() { document.getElementById("adminOverlay").style.display = "none"; }
function ladeAdminDaten() {
    const t = document.getElementById("adTyp").value;
    document.getElementById("ad_dk").value = db[t].dk;
    document.getElementById("ad_le").value = db[t].le;
    document.getElementById("ad_a").value = db[t].a;
    document.getElementById("ad_d").value = db[t].d;
}
function saveAdmin() {
    if(document.getElementById("adminPW").value !== "11111111") return alert("Falsch");
    const t = document.getElementById("adTyp").value;
    db[t] = { dk: parseFloat(document.getElementById("ad_dk").value), le: parseFloat(document.getElementById("ad_le").value), a: parseFloat(document.getElementById("ad_a").value), d: parseFloat(document.getElementById("ad_d").value) };
    localStorage.setItem("luye_v9", JSON.stringify(db));
    ladePreset(); closeAdmin();
}

function drucken() {
    const r = document.getElementById("ergebnis").innerText;
    if(r === "--") return;
    const jetzt = new Date();
    const ts = jetzt.toLocaleDateString("de-DE") + " - " + jetzt.getHours().toString().padStart(2,'0') + ":" + jetzt.getMinutes().toString().padStart(2,'0');
    
    const w = window.open("", "_blank");
    w.document.write(`
        <html>
        <head>
            <style>
                body { font-family: Courier, monospace; padding: 50px; }
                .header-p { border-bottom: 2px solid #000; text-align: center; margin-bottom: 30px; padding-bottom: 10px; }
                table { width: 100%; border-collapse: collapse; }
                td { padding: 15px; border: 1px solid #000; font-size: 18px; }
                .bold { font-weight: bold; font-size: 22px; }
                .sig-area { margin-top: 80px; text-align: left; }
                .sig-line { border-top: 1px solid #000; width: 350px; padding-top: 5px; font-size: 16px; margin-top: 40px; }
                .footer { position: fixed; bottom: 30px; left: 30px; font-size: 12px; }
            </style>
        </head>
        <body>
            <div class="header-p"><h2>Restmengen-Bewertung (Luye Pharma)</h2></div>
            <table>
                <tr><td>Restmenge:</td><td class="bold">${r} Stück</td></tr>
                <tr><td>Rollen-Basis:</td><td>${document.getElementById("typ").value}er Rolle</td></tr>
                <tr><td>Auftrag:</td><td>${document.getElementById("auftrag").value || "---"}</td></tr>
                <tr><td>Charge:</td><td>${document.getElementById("charge").value || "---"}</td></tr>
            </table>
            <div class="sig-area">
                <div class="sig-line">Datum / Kürzel:</div>
            </div>
            <div class="footer">Druckzeitpunkt: ${ts} Uhr</div>
        </body>
        </html>
    `);
    w.document.close();
    w.print();
}
</script>
</body>
</html>
